# ============================================================
# nginx.conf - Frontend Angular
# Plataforma Educativa Móvil Cacique Tamanaco
#
# Sirve el build estático de Angular y redirige /api al backend
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cacheo de archivos estáticos
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Permite subir entregas (PDF/WORD) hasta el límite de multer (10MB)
        client_max_body_size 12m;

        # Comprimir respuestas
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1000;

        # Raíz del build Angular
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # ================================================
        # Proxy reverso para la API
        # /api/* -> http://backend:3000/api/*
        # Usamos variable para forzar resolución DNS
        # en cada request (evita 504 cuando el backend
        # cambia de IP tras un recreate de contenedor)
        # ================================================
        resolver 127.0.0.11 valid=30s ipv6=off;
        location /api/ {
            set $backend_upstream backend:3000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts largos para carga de archivos
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ================================================
        # Archivos estáticos (favicon, assets, etc.)
        # ================================================
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /icons/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.webmanifest$ {
            add_header Content-Type application/manifest+json;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ================================================
        # Service Worker - Sin caché para evitar problemas
        # ================================================
        location /ngsw-worker.js {
            add_header Cache-Control "no-cache";
            proxy_cache_bypass $http_upgrade;
        }

        location /ngsw.json {
            add_header Cache-Control "no-cache";
            proxy_cache_bypass $http_upgrade;
        }

        # ================================================
        # SPA: todas las rutas no encontradas → index.html
        # ================================================
        # index.html nunca se cachea (previene que el SW o
        # el navegador sirvan versiones viejas del JS bundle)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}