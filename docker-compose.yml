# ============================================================
# docker-compose.yml
# Plataforma Educativa Móvil Cacique Tamanaco
#
# Levanta el ecosistema completo:
#   - PostgreSQL 16 (Alpine)
#   - Backend Node.js/Express (TypeScript compilado)
#   - Frontend Angular 21 (PWA) servido por nginx
#
# Uso:
#   docker-compose up --build
#   docker-compose down
# ============================================================

services:

  # ----------------------------------------------------------
  # Servicio: PostgreSQL 16 Alpine
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cacique-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Init scripts: DDL + DML se ejecutan automáticamente
      # la primera vez que se crea la base de datos
      - ./init-scripts/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ./init-scripts/02_dml.sql:/docker-entrypoint-initdb.d/02_dml.sql
      - ./init-scripts/03_e2e_seed.sql:/docker-entrypoint-initdb.d/03_e2e_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cacique_network

  # ----------------------------------------------------------
  # Servicio: Backend (Express + TypeScript)
  # ----------------------------------------------------------
  backend:
    image: cacique-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cacique-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Conexión a PostgreSQL (DATABASE_HOST apunta al service name)
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Servidor Express
      PORT: ${PORT:-3000}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Cifrado AES-256
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_IV: ${ENCRYPTION_IV}
      # Uploads
      UPLOADS_DIR: ${UPLOADS_DIR:-./uploads/entregas}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistir archivos subidos (entregas, documentos)
      - ./uploads/entregas:/app/uploads/entregas
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cacique_network

  # ----------------------------------------------------------
  # Servicio: Frontend Angular 21 PWA (nginx)
  # ----------------------------------------------------------
  frontend:
    image: cacique-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cacique-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # Opcional: exponer 443 si se configura HTTPS
      # - "443:443"
    depends_on:
      - backend
    networks:
      - cacique_network

# ----------------------------------------------------------
# Red interna (bridge) para comunicación aislada
# ----------------------------------------------------------
networks:
  cacique_network:
    driver: bridge
